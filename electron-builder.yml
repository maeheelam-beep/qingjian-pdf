appId: com.qingjian.pdf
productName: Qingjian PDF
copyright: Copyright © 2026 Qingjian
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/fonts
    to: fonts
  - from: resources/icon.png
    to: icon.png
asar: true
compression: maximum
win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Qingjian-PDF-${version}-portable.${ext}
  requestedExecutionLevel: asInvoker
portable:
  artifactName: Qingjian-PDF-${version}-portable.exe
  unpackDirName: QingjianPDF
